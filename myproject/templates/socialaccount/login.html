{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Veloro - Continue with Google</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#f7f5ff,#eef2ff);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.bg-circle{
    position:absolute;
    border-radius:50%;
    background:rgba(124,58,237,.08);
}

.c1{
    width:400px;
    height:400px;
    top:-150px;
    left:-100px;
}

.c2{
    width:350px;
    height:350px;
    bottom:-120px;
    right:-100px;
}

.card{
    width:520px;
    background:#fff;
    padding:50px;
    border-radius:30px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.08);
    position:relative;
    z-index:10;
}

.logo{
    font-size:38px;
    font-weight:700;
    color:#6d28d9;
    margin-bottom:25px;
}

.google-icon{
    width:90px;
    margin:auto;
    margin-bottom:20px;
}

h1{
    font-size:42px;
    color:#111827;
    margin-bottom:15px;
}

.subtitle{
    color:#6b7280;
    margin-bottom:35px;
    line-height:1.7;
}

.google-btn{
    width:100%;
    padding:18px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#7c3aed,#4f46e5);
    color:white;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.google-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(124,58,237,.3);
}

.features{
    display:flex;
    justify-content:space-between;
    margin-top:35px;
}

.feature{
    flex:1;
}

.feature h3{
    color:#4f46e5;
    margin-bottom:5px;
}

.feature p{
    font-size:13px;
    color:#6b7280;
}

</style>
</head>
<body>

<div class="bg-circle c1"></div>
<div class="bg-circle c2"></div>

<div class="card">

    <div class="logo">
        VEOLORO
    </div>

    <img
    class="google-icon"
    src="https://cdn-icons-png.flaticon.com/512/300/300221.png"
    >

    <h1>Sign In With Google</h1>

    <p class="subtitle">
        Continue securely with your Google account and enjoy a seamless shopping experience.
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="google-btn">
            Continue With Google
        </button>
    </form>

    <div class="features">

        <div class="feature">
            <h3>Secure</h3>
            <p>Your data is protected</p>
        </div>

        <div class="feature">
            <h3>Fast</h3>
            <p>One click login</p>
        </div>

        <div class="feature">
            <h3>Reliable</h3>
            <p>Trusted by users</p>
        </div>

    </div>

</div>

</body>
</html>
