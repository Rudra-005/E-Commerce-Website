{% extends 'admin/admin_base.html' %}
{% block title %}Analytics{% endblock %}
{% block content %}
<div class="admin-card">
    <h2>Analytics Dashboard</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px;">
        <!-- Revenue Card -->
        <div style="background: #06d6a0; border: 3px solid #000; box-shadow: 4px 4px 0px #000; padding: 20px; text-align: center; border-radius: 8px;">
            <h3 style="margin: 0; color: #fff; text-transform: uppercase;">Total Revenue</h3>
            <p style="font-size: 2em; font-weight: bold; margin: 10px 0 0 0; color: #fff;">₹{{ total_revenue|floatformat:2 }}</p>
        </div>
        
        <!-- Orders Card -->
        <div style="background: #118ab2; border: 3px solid #000; box-shadow: 4px 4px 0px #000; padding: 20px; text-align: center; border-radius: 8px;">
            <h3 style="margin: 0; color: #fff; text-transform: uppercase;">Total Orders</h3>
            <p style="font-size: 2em; font-weight: bold; margin: 10px 0 0 0; color: #fff;">{{ total_orders }}</p>
        </div>

        <!-- Users Card -->
        <div style="background: #ffd166; border: 3px solid #000; box-shadow: 4px 4px 0px #000; padding: 20px; text-align: center; border-radius: 8px;">
            <h3 style="margin: 0; color: #000; text-transform: uppercase;">Total Users</h3>
            <p style="font-size: 2em; font-weight: bold; margin: 10px 0 0 0; color: #000;">{{ total_users }}</p>
        </div>

        <!-- Products Card -->
        <div style="background: #ef476f; border: 3px solid #000; box-shadow: 4px 4px 0px #000; padding: 20px; text-align: center; border-radius: 8px;">
            <h3 style="margin: 0; color: #fff; text-transform: uppercase;">Total Products</h3>
            <p style="font-size: 2em; font-weight: bold; margin: 10px 0 0 0; color: #fff;">{{ total_products }}</p>
        </div>
    </div>
</div>
{% endblock %}
