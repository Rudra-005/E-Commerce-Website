<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velora Admin - {% block title %}Dashboard{% endblock %}</title>
    <!-- Google Fonts: Comic Neue -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #fce7f3;
            --text-color: #000;
            --primary-color: #facc15;
            --secondary-color: #fb923c;
            --border-color: #000;
            --shadow: 4px 4px 0px #000;
        }

        body {
            font-family: 'Comic Neue', cursive, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#fb923c 2px, transparent 2px);
            background-size: 30px 30px;
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Layout */
        .admin-sidebar {
            width: 250px;
            background: #fff;
            border-right: 4px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .admin-sidebar-header {
            padding: 20px;
            border-bottom: 4px solid var(--border-color);
            background: var(--primary-color);
            text-align: center;
        }

        .admin-sidebar-header h2 {
            margin: 0;
            font-size: 24px;
            text-transform: uppercase;
        }

        /* Main Content */
        .admin-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .admin-topbar {
            background: #fff;
            border-bottom: 4px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
        }

        .admin-content {
            padding: 30px;
        }

        /* Cards and Elements */
        .admin-card {
            background: #fff;
            border: 3px solid var(--border-color);
            box-shadow: var(--shadow);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .admin-btn {
            background: var(--primary-color);
            color: #000;
            border: 3px solid var(--border-color);
            padding: 10px 20px;
            font-size: 16px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 2px 2px 0px #000;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .admin-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px #000;
        }

        .admin-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px #000;
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>

    <!-- Sidebar -->
    {% include 'admin/_sidebar.html' %}

    <!-- Main Content Area -->
    <div class="admin-main">
        <!-- Topbar -->
        <div class="admin-topbar">
            <div>
                <strong>Role:</strong> <span style="text-transform: uppercase; background: var(--secondary-color); padding: 2px 8px; border: 2px solid #000; border-radius: 4px; font-weight: bold;">{% if request.user.is_superuser %}ADMIN{% else %}{{ request.user.userprofile.role|default:"ADMIN" }}{% endif %}</span>
            </div>
            <div>
                Welcome, <strong>{{ request.user.username }}</strong>!
                <a href="{% url 'logout' %}" class="admin-btn" style="margin-left: 15px; padding: 5px 15px; font-size: 14px;">Logout</a>
            </div>
        </div>

        <!-- Page Content -->
        <div class="admin-content">
            {% block content %}
            {% endblock %}
        </div>
    </div>

    {% block extra_js %}{% endblock %}
</body>
</html>
