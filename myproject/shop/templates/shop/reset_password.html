<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Velora</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg-color: #fcf8f2;
    --border-color: #000000;
    --primary-red: #ef476f;
    --primary-yellow: #ffd166;
    --primary-blue: #118ab2;
    --primary-green: #06d6a0;
    --shadow-solid: 6px 6px 0px #000000;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Comic Neue', cursive; }
body {
    background: var(--bg-color);
    overflow-x: hidden;
    color: #000;
    background-image: radial-gradient(#d3ccc1 20%, transparent 20%);
    background-size: 10px 10px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}
.navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    min-height: 85px;
    background: #fff;
    border-bottom: 4px solid var(--border-color);
    position: relative;
    z-index: 1000;
}
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-icon { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; background: var(--primary-yellow); border: 3px solid var(--border-color); box-shadow: 3px 3px 0px var(--border-color); color: #000; font-size: 24px; font-weight: 800; font-family: 'Bangers', cursive; transform: rotate(-5deg); }
.logo-text { font-size: 38px; font-family: 'Bangers', cursive; color: #000; line-height: 1; text-transform: uppercase; letter-spacing: 2px; text-shadow: 2px 2px 0px var(--primary-red); }

.auth-wrapper {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
}
.auth-card {
    background: #fff;
    width: 100%;
    max-width: 450px;
    border: 4px solid var(--border-color);
    box-shadow: 12px 12px 0px var(--border-color);
    padding: 40px;
}
.auth-card h2 {
    font-family: 'Bangers', cursive;
    font-size: 42px;
    text-align: center;
    margin-bottom: 10px;
    letter-spacing: 2px;
    text-shadow: 2px 2px 0px var(--primary-blue);
    text-transform: uppercase;
}
.auth-card .subtitle {
    text-align: center;
    font-size: 16px;
    color: #555;
    margin-bottom: 30px;
    font-weight: bold;
}
.input-group { margin-bottom: 20px; position: relative; }
.input-group label {
    display: block;
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-family: 'Bangers', cursive;
}
.input-group input {
    width: 100%;
    padding: 15px;
    padding-right: 50px;
    border: 3px solid var(--border-color);
    font-size: 18px;
    font-weight: bold;
    background: #fcf8f2;
    outline: none;
    transition: all 0.1s ease;
}
.input-group input:focus {
    background: #fff;
    box-shadow: 4px 4px 0px var(--primary-blue);
}
.toggle-password {
    position: absolute;
    right: 15px;
    top: 42px;
    cursor: pointer;
    font-size: 20px;
    user-select: none;
    background: none;
    border: none;
    padding: 5px;
}
.auth-btn {
    width: 100%;
    background: var(--primary-blue);
    color: #fff;
    padding: 15px;
    font-family: 'Bangers', cursive;
    font-size: 28px;
    text-decoration: none;
    border: 4px solid var(--border-color);
    box-shadow: 6px 6px 0px var(--border-color);
    transition: all 0.1s ease;
    text-transform: uppercase;
    cursor: pointer;
    letter-spacing: 2px;
}
.auth-btn:hover {
    background: var(--primary-green);
    color: #000;
    transform: translate(4px, 4px);
    box-shadow: 2px 2px 0px var(--border-color);
}
.error-box {
    padding: 15px;
    border: 3px solid var(--border-color);
    margin-bottom: 20px;
    font-weight: bold;
    text-align: center;
    background: var(--primary-red);
    color: white;
}
.step-indicator {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 25px;
}
.step-dot {
    width: 12px;
    height: 12px;
    border: 2px solid var(--border-color);
    background: #ddd;
}
.step-dot.active {
    background: var(--primary-blue);
    box-shadow: 2px 2px 0px var(--border-color);
}
.step-dot.done {
    background: var(--primary-green);
}
.icon-key {
    text-align: center;
    font-size: 60px;
    margin-bottom: 10px;
}
.password-rules {
    background: #fcf8f2;
    border: 2px solid #ddd;
    padding: 12px 15px;
    margin-bottom: 20px;
    font-size: 13px;
    color: #666;
}
.password-rules strong {
    display: block;
    margin-bottom: 5px;
    color: #000;
    font-size: 14px;
}
@media(max-width: 600px) {
    .navbar { padding: 15px; justify-content: center; flex-wrap: wrap; gap: 15px; }
    .auth-card { padding: 25px; }
    .auth-card h2 { font-size: 32px; }
}
</style>
</head>
<body>

<nav class="navbar">
    <a href="{% url 'home' %}" class="logo" style="text-decoration: none; color: inherit;">
        <span class="logo-icon"> ✦ </span>
        <span class="logo-text">Velora</span>
    </a>
</nav>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="step-indicator">
            <div class="step-dot done"></div>
            <div class="step-dot done"></div>
            <div class="step-dot active"></div>
        </div>
        <div class="icon-key">🔑</div>
        <h2>New Password</h2>
        <p class="subtitle">Almost there! Create a strong new password for your account.</p>

        {% if error %}
            <div class="error-box">{{ error }}</div>
        {% endif %}

        <div class="password-rules">
            <strong>Password requirements:</strong>
            ✓ At least 8 characters long<br>
            ✓ Both fields must match
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <label>New Password</label>
                <input type="password" name="password1" id="password1" placeholder="Enter new password" required minlength="8">
                <button type="button" class="toggle-password" onclick="togglePassword('password1', this)">👁️</button>
            </div>
            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" name="password2" id="password2" placeholder="Re-enter new password" required minlength="8">
                <button type="button" class="toggle-password" onclick="togglePassword('password2', this)">👁️</button>
            </div>
            <button type="submit" class="auth-btn">RESET PASSWORD</button>
        </form>
    </div>
</div>

<script>
function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
    } else {
        input.type = 'password';
        btn.textContent = '👁️';
    }
}
</script>

</body>
</html>
