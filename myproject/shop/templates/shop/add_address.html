{% extends 'shop/home.html' %}
{% load static %}
{% block content %}
<style>
    .form-container {
        max-width: 600px;
        margin: 50px auto;
        padding: 0 20px;
    }
    
    .form-card {
        background: #fff;
        border: 6px solid #000;
        box-shadow: 10px 10px 0px #000;
        padding: 40px;
        transform: rotate(-1deg);
    }
    
    .form-card h1 {
        
        font-size: 42px;
        text-transform: uppercase;
        letter-spacing: 2px;
        background: var(--primary-yellow);
        padding: 10px 20px;
        border: 4px solid #000;
        display: inline-block;
        margin-bottom: 30px;
        box-shadow: 4px 4px 0px #000;
        transform: rotate(-2deg);
    }
    
    .comic-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    
    .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    
    .form-group label {
        
        font-size: 20px;
        letter-spacing: 1px;
        color: #000;
    }
    
    .form-control {
        border: 4px solid #000;
        padding: 12px 15px;
        font-size: 16px;
        
        font-weight: bold;
        background: #fcf8f2;
        outline: none;
        transition: all 0.1s ease;
    }
    
    .form-control:focus {
        background: #fff;
        border-color: var(--primary-blue);
        box-shadow: 4px 4px 0px #000;
    }
    
    .button-group {
        display: flex;
        gap: 20px;
        margin-top: 15px;
    }
    
    .comic-btn {
        display: inline-block;
        background: var(--primary-red);
        color: #fff;
        padding: 12px 30px;
        border: 4px solid #000;
        box-shadow: 6px 6px 0px #000;
        text-decoration: none;
        
        font-size: 24px;
        transition: all 0.1s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        text-align: center;
    }
    
    .comic-btn:hover {
        transform: translate(2px, 2px);
        box-shadow: 4px 4px 0px #000;
        background: var(--primary-yellow);
        color: #000;
    }
    
    .comic-btn-cancel {
        background: #fff;
        color: #000;
    }
    
    .comic-btn-cancel:hover {
        background: #eee;
        color: #000;
    }
    
    @media (max-width: 600px) {
        .form-card {
            transform: none !important;
            padding: 20px;
        }
        .button-group {
            flex-direction: column;
        }
    }
</style>

<div class="form-container">
    <div class="form-card" data-aos="zoom-in">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1 style="margin-bottom: 0;">📍 Add Address</h1>
            <button type="button" id="detectLocationBtn" class="comic-btn" style="background: var(--primary-blue); font-size: 16px; padding: 10px 15px; margin: 0;" onclick="detectLocation('detectLocationBtn', 'address_line_1', 'city', 'state', 'pincode')">📍 Detect My Location</button>
        </div>
        
        <form method="POST" class="comic-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" class="form-control" placeholder="Tony Stark" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone" class="form-control" placeholder="e.g. +1 555-0199" required>
            </div>
            
            <div class="form-group">
                <label for="address_line_1">Address Line 1</label>
                <input type="text" id="address_line_1" name="address_line_1" class="form-control" placeholder="10880 Malibu Point" required>
            </div>
            
            <div class="form-group">
                <label for="address_line_2">Address Line 2 (Optional)</label>
                <input type="text" id="address_line_2" name="address_line_2" class="form-control" placeholder="Penthouse / Suite">
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city" class="form-control" placeholder="Malibu" required>
                </div>
                
                <div class="form-group">
                    <label for="state">State</label>
                    <input type="text" id="state" name="state" class="form-control" placeholder="California" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="pincode">Pincode / ZIP</label>
                <input type="text" id="pincode" name="pincode" class="form-control" placeholder="90265" required>
            </div>
            
            <div class="button-group">
                <button type="submit" class="comic-btn">Save Address 🚀</button>
                <a href="{% url 'profile' %}" class="comic-btn comic-btn-cancel">Cancel ❌</a>
            </div>
        </form>
    </div>
</div>

<script src="{% static 'shop/js/location.js' %}"></script>
{% endblock %}
