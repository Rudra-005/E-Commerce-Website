<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
            margin:0;
            padding:0;
        }

        .container{
            width:80%;
            max-width:700px;
            margin:50px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,.1);
        }

        h1{
            text-align:center;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
        }

        button{
            width:100%;
            padding:12px;
            background:green;
            color:white;
            border:none;
            cursor:pointer;
            font-size:18px;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>Checkout</h1>

    <form>

        <input type="text" placeholder="Full Name">

        <input type="email" placeholder="Email">

        <input type="text" placeholder="Address">

        <button type="submit">
            Place Order
        </button>

    </form>

</div>

</body>
</html>
