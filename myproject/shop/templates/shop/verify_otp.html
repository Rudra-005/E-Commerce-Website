<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velora - Verify Email</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(90deg,#000814,#001d3d);
}
.container{
    width:450px;
    background:white;
    padding:40px;
    border-radius:25px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}
.logo{
    text-align:center;
    color:#ff9800;
    font-size:42px;
    font-weight:700;
    margin-bottom:10px;
}
.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
    font-size:14px;
}
.input-group{
    margin-bottom:15px;
}
.input-group input{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
    font-size:15px;
    text-align:center;
    letter-spacing:4px;
}
.input-group input:focus{
    border-color:#ff9800;
}
.verify-btn{
    width:100%;
    border:none;
    background:#ff9800;
    color:black;
    font-weight:700;
    padding:15px;
    border-radius:10px;
    cursor:pointer;
    margin-top:10px;
    font-size:16px;
}
.verify-btn:hover{
    background:#f57c00;
}
.resend-link{
    text-align:center;
    margin-top:20px;
}
.resend-link a{
    color:#0066ff;
    text-decoration:none;
}
</style>
</head>
<body>

<div class="container">
    <div class="logo">Velora</div>
    <p class="subtitle">Enter the 6-digit OTP sent to your email.</p>

    {% if error %}
        <div style="margin-bottom: 20px;">
            <div style="color: red; text-align: center; font-weight: 500; background-color: #ffe6e6; padding: 10px; border-radius: 10px;">
                {{ error }}
            </div>
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="input-group">
            <input type="text" name="otp" placeholder="Enter OTP" maxlength="6" required>
        </div>
        <button type="submit" class="verify-btn">
            Verify Email
        </button>
    </form>

    <div class="resend-link">
        Didn't receive code?
        <a href="{% url 'signup' %}">
            Sign up again
        </a>
    </div>
</div>

</body>
</html>
