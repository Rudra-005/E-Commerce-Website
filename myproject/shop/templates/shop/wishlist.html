<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Wishlist - Velora</title>

<!-- Fonts & Animations -->
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

<style>
:root {
    --bg-color: #fcf8f2;
    --border-color: #000000;
    --primary-red: #ef476f;
    --primary-yellow: #ffd166;
    --primary-blue: #118ab2;
    --shadow-solid: 6px 6px 0px #000000;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Comic Neue', cursive;
}

body {
    background: var(--bg-color);
    overflow-x: hidden;
    color: #000;
    background-image: radial-gradient(#d3ccc1 20%, transparent 20%);
    background-size: 10px 10px;
}

/* NAVBAR (Matching home.html) */
.navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    min-height: 85px;
    background: #fff;
    border-bottom: 4px solid var(--border-color);
    position: relative;
    z-index: 1000;
}
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-icon { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; background: var(--primary-yellow); border: 3px solid var(--border-color); box-shadow: 3px 3px 0px var(--border-color); color: #000; font-size: 24px; font-weight: 800; font-family: 'Bangers', cursive; transform: rotate(-5deg); }
.logo-text { font-size: 38px; font-family: 'Bangers', cursive; color: #000; line-height: 1; text-transform: uppercase; letter-spacing: 2px; text-shadow: 2px 2px 0px var(--primary-red); }
.back-btn { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: 'Bangers', cursive; font-size: 24px; color: #000; background: var(--primary-yellow); border: 3px solid var(--border-color); padding: 8px 24px; box-shadow: 4px 4px 0px var(--border-color); transition: all 0.1s ease; letter-spacing: 1px; }
.back-btn:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--border-color); background: var(--primary-red); color: #fff; }

/* PAGE TITLE */
.page-title {
    text-align: center;
    font-family: 'Bangers', cursive;
    font-size: 60px;
    margin: 50px 0;
    text-transform: uppercase;
    text-shadow: 3px 3px 0px var(--primary-blue);
    color: #fff;
    -webkit-text-stroke: 2px var(--border-color);
    letter-spacing: 3px;
}

/* WISHLIST CONTAINER */
.wishlist-container {
    width: 90%;
    max-width: 1200px;
    margin: 0 auto 80px;
}

/* WISHLIST ITEM */
.wishlist-item {
    background: #fff;
    display: flex;
    gap: 30px;
    padding: 30px;
    margin-bottom: 30px;
    border: 4px solid var(--border-color);
    box-shadow: 8px 8px 0px var(--border-color);
    align-items: center;
    position: relative;
}
.wishlist-item:nth-child(even) { transform: rotate(1deg); }
.wishlist-item:nth-child(odd) { transform: rotate(-1deg); }
.wishlist-item img {
    width: 220px;
    height: 220px;
    object-fit: contain;
    border: 4px solid var(--border-color);
    background: #fff;
    padding: 10px;
}
.wishlist-info { flex: 1; }
.wishlist-info h2 {
    font-family: 'Bangers', cursive;
    font-size: 40px;
    margin-bottom: 15px;
    letter-spacing: 1px;
    text-transform: uppercase;
}
.price {
    font-family: 'Bangers', cursive;
    font-size: 34px;
    color: var(--primary-red);
    margin-bottom: 25px;
}
.button-group {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}
.cart-btn {
    background: var(--primary-yellow);
    color: #000;
    padding: 10px 25px;
    border: 3px solid var(--border-color);
    box-shadow: 4px 4px 0px var(--border-color);
    text-decoration: none;
    font-family: 'Bangers', cursive;
    font-size: 24px;
    transition: all 0.1s ease;
    text-transform: uppercase;
}
.cart-btn:hover { background: var(--primary-blue); color: #fff; transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--border-color); }
.remove-btn {
    background: var(--primary-red);
    color: #fff;
    padding: 10px 25px;
    border: 3px solid var(--border-color);
    box-shadow: 4px 4px 0px var(--border-color);
    text-decoration: none;
    font-family: 'Bangers', cursive;
    font-size: 24px;
    transition: all 0.1s ease;
}
.remove-btn:hover { background: #000; color: #fff; transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--border-color); }

/* EMPTY WISHLIST */
.empty-wishlist {
    text-align: center;
    background: #fff;
    padding: 80px 40px;
    border: 4px solid var(--border-color);
    box-shadow: 10px 10px 0px var(--border-color);
}
.empty-wishlist h2 {
    font-family: 'Bangers', cursive;
    font-size: 55px;
    margin-bottom: 40px;
    color: var(--primary-red);
    text-shadow: 2px 2px 0px var(--border-color);
}
.shop-btn {
    display: inline-block;
    background: var(--primary-yellow);
    color: #000;
    padding: 18px 45px;
    border: 4px solid var(--border-color);
    box-shadow: 6px 6px 0px var(--border-color);
    text-decoration: none;
    font-family: 'Bangers', cursive;
    font-size: 32px;
    transition: all 0.1s ease;
    text-transform: uppercase;
    letter-spacing: 2px;
}
.shop-btn:hover { background: var(--primary-blue); color: #fff; transform: translate(4px, 4px); box-shadow: 2px 2px 0px var(--border-color); }

/* MOBILE */
@media(max-width: 900px) {
    .navbar { flex-direction: column; gap: 15px; padding: 15px; }
    .wishlist-item { flex-direction: column; text-align: center; }
    .wishlist-item img { width: 100%; height: 300px; }
    .wishlist-info h2 { font-size: 34px; }
    .price { font-size: 32px; }
    .page-title { font-size: 45px; }
    .button-group { justify-content: center; }
}
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <a href="{% url 'home' %}" class="logo" style="text-decoration: none; color: inherit;">
        <span class="logo-icon"> ✦ </span>
        <span class="logo-text">Velora</span>
    </a>
    <a href="{% url 'home' %}" class="back-btn">
        ⬅ CONTINUE SHOPPING
    </a>
</nav>

<!-- TITLE -->
<h1 class="page-title" data-aos="fade-down">YOUR WISHLIST</h1>

<div class="wishlist-container">

{% if wishlist_items %}

    {% for item in wishlist_items %}
    <div class="wishlist-item" data-aos="fade-right">
        <a href="{% url 'product_detail' item.product.id %}">
            <img src="{{ item.product.image }}" alt="{{ item.product.name }}">
        </a>
        <div class="wishlist-info">
            <a href="{% url 'product_detail' item.product.id %}" style="text-decoration:none; color:inherit;">
                <h2>{{ item.product.name }}</h2>
            </a>
            <div class="price">₹{{ item.product.price }}</div>
            <div class="button-group">
                <a href="{% url 'add_to_cart' item.product.id %}" class="cart-btn">🛒 ADD TO CART</a>
                <a href="{% url 'remove_from_wishlist' item.product.id %}" class="remove-btn">💔 REMOVE</a>
            </div>
        </div>
    </div>
    {% endfor %}

{% else %}

    <div class="empty-wishlist" data-aos="zoom-in">
        <h2>YOUR WISHLIST IS EMPTY!</h2>
        <a href="{% url 'home' %}" class="shop-btn">DISCOVER GEAR!</a>
    </div>

{% endif %}

</div>

<!-- SCRIPTS -->
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init({ duration: 800, once: true });
</script>

{% include "chatbot/widget.html" %}
</body>
</html>
