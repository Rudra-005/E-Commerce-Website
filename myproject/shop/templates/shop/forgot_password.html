{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - Velora</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg-color: #fcf8f2;
    --border-color: #000000;
    --primary-red: #ef476f;
    --primary-yellow: #ffd166;
    --primary-blue: #118ab2;
    --shadow-solid: 6px 6px 0px #000000;
}
* { margin: 0; padding: 0; box-sizing: border-box;  }
body {
    background: var(--bg-color);
    overflow-x: hidden;
    color: #000;
    background-image: radial-gradient(#d3ccc1 20%, transparent 20%);
    background-size: 10px 10px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}
.navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    min-height: 85px;
    background: #fff;
    border-bottom: 4px solid var(--border-color);
    position: relative;
    z-index: 1000;
}
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-icon { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; background: var(--primary-yellow); border: 3px solid var(--border-color); box-shadow: 3px 3px 0px var(--border-color); color: #000; font-size: 24px; font-weight: 800;  transform: rotate(-5deg); }
.logo-text { font-size: 38px;  color: #000; line-height: 1; text-transform: uppercase; letter-spacing: 2px;  }

.auth-wrapper {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
}
.auth-card {
    background: #fff;
    width: 100%;
    max-width: 450px;
    border: 4px solid var(--border-color);
    box-shadow: 12px 12px 0px var(--border-color);
    padding: 40px;
}
.auth-card h2 {
    
    font-size: 42px;
    text-align: center;
    margin-bottom: 10px;
    letter-spacing: 2px;
    
    text-transform: uppercase;
}
.auth-card .subtitle {
    text-align: center;
    font-size: 16px;
    color: #555;
    margin-bottom: 30px;
    font-weight: bold;
}
.input-group { margin-bottom: 20px; }
.input-group input {
    width: 100%;
    padding: 15px;
    border: 3px solid var(--border-color);
    font-size: 18px;
    font-weight: bold;
    background: #fcf8f2;
    outline: none;
    transition: all 0.1s ease;
}
.input-group input:focus {
    background: #fff;
    box-shadow: 4px 4px 0px var(--primary-yellow);
}
.auth-btn {
    width: 100%;
    background: var(--primary-blue);
    color: #fff;
    padding: 15px;
    
    font-size: 28px;
    text-decoration: none;
    border: 4px solid var(--border-color);
    box-shadow: 6px 6px 0px var(--border-color);
    transition: all 0.1s ease;
    text-transform: uppercase;
    cursor: pointer;
    letter-spacing: 2px;
}
.auth-btn:hover {
    background: var(--primary-yellow);
    color: #000;
    transform: translate(4px, 4px);
    box-shadow: 2px 2px 0px var(--border-color);
}
.error-box {
    padding: 15px;
    border: 3px solid var(--border-color);
    margin-bottom: 20px;
    font-weight: bold;
    text-align: center;
    background: var(--primary-red);
    color: white;
}
.auth-link {
    text-align: center;
    margin-top: 25px;
    font-size: 18px;
    font-weight: bold;
}
.auth-link a {
    color: var(--primary-red);
    text-decoration: none;
    
    font-size: 24px;
    letter-spacing: 1px;
}
.auth-link a:hover {
    
}
.icon-lock {
    text-align: center;
    font-size: 60px;
    margin-bottom: 10px;
}
@media(max-width: 600px) {
    .navbar { padding: 15px; justify-content: center; flex-wrap: wrap; gap: 15px; }
    .auth-card { padding: 25px; }
    .auth-card h2 { font-size: 32px; }
}
</style>
    <link rel="stylesheet" href="{% static 'shop/css/global.css' %}">
</head>
<body>

<nav class="navbar">
    <a href="{% url 'home' %}" class="logo" style="text-decoration: none; color: inherit;">
        <span class="logo-icon"> ✦ </span>
        <span class="logo-text">Velora</span>
    </a>
</nav>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="icon-lock">🔒</div>
        <h2>Forgot Password?</h2>
        <p class="subtitle">No worries! Enter your email and we'll send you an OTP to reset your password.</p>

        {% if error %}
            <div class="error-box">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <input type="email" name="email" placeholder="Enter your email address" required>
            </div>
            <button type="submit" class="auth-btn">SEND OTP</button>
        </form>

        <div class="auth-link">
            Remember your password? <br>
            <a href="{% url 'login' %}">Back to Login</a>
        </div>
    </div>
</div>

{% include "chatbot/widget.html" %}
</body>
</html>
