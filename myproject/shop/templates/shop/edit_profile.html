{% extends 'shop/home.html' %}

{% block content %}
<style>
    .form-container {
        max-width: 600px;
        margin: 50px auto;
        padding: 0 20px;
    }
    
    .form-card {
        background: #fff;
        border: 6px solid #000;
        box-shadow: 10px 10px 0px #000;
        padding: 40px;
        transform: rotate(1deg);
    }
    
    .form-card h1 {
        
        font-size: 42px;
        text-transform: uppercase;
        letter-spacing: 2px;
        background: var(--primary-yellow);
        padding: 10px 20px;
        border: 4px solid #000;
        display: inline-block;
        margin-bottom: 30px;
        box-shadow: 4px 4px 0px #000;
        transform: rotate(2deg);
    }
    
    .comic-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    
    .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    
    .form-group label {
        
        font-size: 20px;
        letter-spacing: 1px;
        color: #000;
    }
    
    .form-control {
        border: 4px solid #000;
        padding: 12px 15px;
        font-size: 16px;
        
        font-weight: bold;
        background: #fcf8f2;
        outline: none;
        transition: all 0.1s ease;
    }
    
    .form-control:focus {
        background: #fff;
        border-color: var(--primary-blue);
        box-shadow: 4px 4px 0px #000;
    }
    
    .button-group {
        display: flex;
        gap: 20px;
        margin-top: 15px;
    }
    
    .comic-btn {
        display: inline-block;
        background: var(--primary-red);
        color: #fff;
        padding: 12px 30px;
        border: 4px solid #000;
        box-shadow: 6px 6px 0px #000;
        text-decoration: none;
        
        font-size: 24px;
        transition: all 0.1s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        text-align: center;
    }
    
    .comic-btn:hover {
        transform: translate(2px, 2px);
        box-shadow: 4px 4px 0px #000;
        background: var(--primary-yellow);
        color: #000;
    }
    
    .comic-btn-cancel {
        background: #fff;
        color: #000;
    }
    
    .comic-btn-cancel:hover {
        background: #eee;
        color: #000;
    }
    
    @media (max-width: 600px) {
        .form-card {
            transform: none !important;
            padding: 20px;
        }
        .button-group {
            flex-direction: column;
        }
    }
</style>

<div class="form-container">
    <div class="form-card" data-aos="zoom-in">
        <h1>👤 Edit Profile</h1>
        
        <form method="POST" enctype="multipart/form-data" class="comic-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="first_name">First Name / Nickname</label>
                <input type="text" id="first_name" name="first_name" class="form-control" placeholder="First Name" value="{{ request.user.first_name|default:request.user.username }}" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Email Address" value="{{ request.user.email }}" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone" class="form-control" placeholder="Phone Number" value="{{ profile.phone }}">
            </div>

            <div class="form-group">
                <label for="date_of_birth">Date of Birth</label>
                <input type="date" id="date_of_birth" name="date_of_birth" class="form-control" value="{{ profile.date_of_birth|date:'Y-m-d' }}">
            </div>

            <div class="form-group">
                <label for="profile_image">Profile Picture</label>
                {% if profile.profile_image %}
                    <div style="margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px;">
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <img src="{{ profile.profile_image.url }}" alt="Profile Image" style="width: 80px; height: 80px; border-radius: 50%; border: 3px solid #000; object-fit: cover;">
                            <span style="font-weight: bold;">Current Image</span>
                        </div>
                        <label style="display: flex; align-items: center; gap: 8px;  font-size: 16px; cursor: pointer; color: var(--primary-red);">
                            <input type="checkbox" name="remove_image" style="width: 20px; height: 20px; cursor: pointer;">
                            <strong>Remove picture to use avatar instead</strong>
                        </label>
                    </div>
                {% endif %}
                <input type="file" id="profile_image" name="profile_image" class="form-control" accept="image/*">
            </div>

            <div class="form-group">
                <label>Choose Avatar (If No Profile Picture)</label>
                <p style="font-size: 14px; font-weight: bold; color: #555; margin-bottom: 10px;">Pick your alter ego! This shows when you haven't uploaded a photo.</p>
                <input type="hidden" name="avatar" id="avatarInput" value="{{ profile.avatar|default:'ninja' }}">
                <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <div class="avatar-option {% if profile.avatar == 'ninja' or not profile.avatar %}selected{% endif %}" data-avatar="ninja" onclick="selectAvatar(this, 'ninja')">
                        <span>🥷</span>
                        <small>Ninja</small>
                    </div>
                    <div class="avatar-option {% if profile.avatar == 'alien' %}selected{% endif %}" data-avatar="alien" onclick="selectAvatar(this, 'alien')">
                        <span>👽</span>
                        <small>Alien</small>
                    </div>
                    <div class="avatar-option {% if profile.avatar == 'robot' %}selected{% endif %}" data-avatar="robot" onclick="selectAvatar(this, 'robot')">
                        <span>🤖</span>
                        <small>Robot</small>
                    </div>
                    <div class="avatar-option {% if profile.avatar == 'ghost' %}selected{% endif %}" data-avatar="ghost" onclick="selectAvatar(this, 'ghost')">
                        <span>👻</span>
                        <small>Ghost</small>
                    </div>
                    <div class="avatar-option {% if profile.avatar == 'wizard' %}selected{% endif %}" data-avatar="wizard" onclick="selectAvatar(this, 'wizard')">
                        <span>🧙</span>
                        <small>Wizard</small>
                    </div>
                    <div class="avatar-option {% if profile.avatar == 'astronaut' %}selected{% endif %}" data-avatar="astronaut" onclick="selectAvatar(this, 'astronaut')">
                        <span>🧑‍🚀</span>
                        <small>Astro</small>
                    </div>
                    <div class="avatar-option {% if profile.avatar == 'cat' %}selected{% endif %}" data-avatar="cat" onclick="selectAvatar(this, 'cat')">
                        <span>😺</span>
                        <small>Cat</small>
                    </div>
                </div>
            </div>

            <style>
                .avatar-option {
                    width: 70px;
                    height: 85px;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    gap: 4px;
                    border: 4px solid #000;
                    background: #fcf8f2;
                    box-shadow: 4px 4px 0px #000;
                    cursor: pointer;
                    transition: all 0.15s ease;
                    user-select: none;
                }
                .avatar-option span {
                    font-size: 32px;
                    line-height: 1;
                }
                .avatar-option small {
                    
                    font-size: 12px;
                    letter-spacing: 0.5px;
                    color: #555;
                }
                .avatar-option:hover {
                    transform: translateY(-3px) scale(1.05);
                    box-shadow: 6px 6px 0px #000;
                    background: #fff;
                }
                .avatar-option.selected {
                    background: var(--primary-yellow);
                    transform: translateY(-2px);
                    box-shadow: 6px 6px 0px #000;
                    border-color: var(--primary-red);
                }
                .avatar-option.selected small {
                    color: #000;
                    font-weight: bold;
                }
            </style>

            <script>
                function selectAvatar(el, value) {
                    document.querySelectorAll('.avatar-option').forEach(a => a.classList.remove('selected'));
                    el.classList.add('selected');
                    document.getElementById('avatarInput').value = value;
                }
            </script>
            
            <div class="button-group">
                <button type="submit" class="comic-btn">Save Changes ⚡</button>
                <a href="{% url 'profile' %}" class="comic-btn comic-btn-cancel">Cancel ❌</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
