{% extends 'shop/home.html' %}

{% block content %}
<style>
    .form-container {
        max-width: 600px;
        margin: 50px auto;
        padding: 0 20px;
    }
    
    .form-card {
        background: #fff;
        border: 6px solid #000;
        box-shadow: 10px 10px 0px #000;
        padding: 40px;
        transform: rotate(1deg);
    }
    
    .form-card h1 {
        font-family: 'Bangers', cursive;
        font-size: 42px;
        text-transform: uppercase;
        letter-spacing: 2px;
        background: var(--primary-yellow);
        padding: 10px 20px;
        border: 4px solid #000;
        display: inline-block;
        margin-bottom: 30px;
        box-shadow: 4px 4px 0px #000;
        transform: rotate(2deg);
    }
    
    .comic-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    
    .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    
    .form-group label {
        font-family: 'Bangers', cursive;
        font-size: 20px;
        letter-spacing: 1px;
        color: #000;
    }
    
    .form-control {
        border: 4px solid #000;
        padding: 12px 15px;
        font-size: 16px;
        font-family: 'Comic Neue', cursive;
        font-weight: bold;
        background: #fcf8f2;
        outline: none;
        transition: all 0.1s ease;
    }
    
    .form-control:focus {
        background: #fff;
        border-color: var(--primary-blue);
        box-shadow: 4px 4px 0px #000;
    }
    
    .button-group {
        display: flex;
        gap: 20px;
        margin-top: 15px;
    }
    
    .comic-btn {
        display: inline-block;
        background: var(--primary-red);
        color: #fff;
        padding: 12px 30px;
        border: 4px solid #000;
        box-shadow: 6px 6px 0px #000;
        text-decoration: none;
        font-family: 'Bangers', cursive;
        font-size: 24px;
        transition: all 0.1s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        text-align: center;
    }
    
    .comic-btn:hover {
        transform: translate(2px, 2px);
        box-shadow: 4px 4px 0px #000;
        background: var(--primary-yellow);
        color: #000;
    }
    
    .comic-btn-cancel {
        background: #fff;
        color: #000;
    }
    
    .comic-btn-cancel:hover {
        background: #eee;
        color: #000;
    }
    
    @media (max-width: 600px) {
        .form-card {
            transform: none !important;
            padding: 20px;
        }
        .button-group {
            flex-direction: column;
        }
    }
</style>

<div class="form-container">
    <div class="form-card" data-aos="zoom-in">
        <h1>👤 Edit Profile</h1>
        
        <form method="POST" enctype="multipart/form-data" class="comic-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="first_name">First Name / Nickname</label>
                <input type="text" id="first_name" name="first_name" class="form-control" placeholder="First Name" value="{{ request.user.first_name|default:request.user.username }}" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Email Address" value="{{ request.user.email }}" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone" class="form-control" placeholder="Phone Number" value="{{ profile.phone }}">
            </div>

            <div class="form-group">
                <label for="date_of_birth">Date of Birth</label>
                <input type="date" id="date_of_birth" name="date_of_birth" class="form-control" value="{{ profile.date_of_birth|date:'Y-m-d' }}">
            </div>

            <div class="form-group">
                <label for="profile_image">Profile Picture</label>
                {% if profile.profile_image %}
                    <div style="margin-bottom: 10px; display: flex; align-items: center; gap: 15px;">
                        <img src="{{ profile.profile_image.url }}" alt="Profile Image" style="width: 80px; height: 80px; border-radius: 50%; border: 3px solid #000; object-fit: cover;">
                        <span style="font-weight: bold;">Current Image</span>
                    </div>
                {% endif %}
                <input type="file" id="profile_image" name="profile_image" class="form-control" accept="image/*">
            </div>
            
            <div class="button-group">
                <button type="submit" class="comic-btn">Save Changes ⚡</button>
                <a href="{% url 'profile' %}" class="comic-btn comic-btn-cancel">Cancel ❌</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
