<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Velora</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root {
    --bg-color: #fcf8f2;
    --border-color: #000000;
    --primary-red: #ef476f;
    --primary-yellow: #ffd166;
    --primary-blue: #118ab2;
    --shadow-solid: 6px 6px 0px #000000;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Comic Neue', cursive; }
body {
    background: var(--bg-color);
    overflow-x: hidden;
    color: #000;
    background-image: radial-gradient(#d3ccc1 20%, transparent 20%);
    background-size: 10px 10px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}
/* NAVBAR */
.navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    min-height: 85px;
    background: #fff;
    border-bottom: 4px solid var(--border-color);
    position: relative;
    z-index: 1000;
}
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-icon { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; background: var(--primary-yellow); border: 3px solid var(--border-color); box-shadow: 3px 3px 0px var(--border-color); color: #000; font-size: 24px; font-weight: 800; font-family: 'Bangers', cursive; transform: rotate(-5deg); }
.logo-text { font-size: 38px; font-family: 'Bangers', cursive; color: #000; line-height: 1; text-transform: uppercase; letter-spacing: 2px; text-shadow: 2px 2px 0px var(--primary-red); }
.cart { display: flex; align-items: center; gap: 10px; text-decoration: none; font-size: 20px; font-weight: 700; color: #000; background: #fff; border: 3px solid var(--border-color); padding: 8px 16px; box-shadow: 4px 4px 0px var(--border-color); transition: all 0.1s ease; }
.cart:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--border-color); background: var(--primary-yellow); }

/* AUTH CONTAINER */
.auth-wrapper {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
}
.auth-card {
    background: #fff;
    width: 100%;
    max-width: 450px;
    border: 4px solid var(--border-color);
    box-shadow: 12px 12px 0px var(--border-color);
    padding: 40px;
}
.auth-card h2 {
    font-family: 'Bangers', cursive;
    font-size: 48px;
    text-align: center;
    margin-bottom: 30px;
    letter-spacing: 2px;
    text-shadow: 2px 2px 0px var(--primary-yellow);
    text-transform: uppercase;
}
.input-group { margin-bottom: 20px; }
.input-group input {
    width: 100%;
    padding: 15px;
    border: 3px solid var(--border-color);
    font-size: 18px;
    font-weight: bold;
    background: #fcf8f2;
    outline: none;
    transition: all 0.1s ease;
}
.input-group input:focus {
    background: #fff;
    box-shadow: 4px 4px 0px var(--primary-yellow);
}
.auth-btn {
    width: 100%;
    background: var(--primary-blue);
    color: #fff;
    padding: 15px;
    font-family: 'Bangers', cursive;
    font-size: 28px;
    text-decoration: none;
    border: 4px solid var(--border-color);
    box-shadow: 6px 6px 0px var(--border-color);
    transition: all 0.1s ease;
    text-transform: uppercase;
    cursor: pointer;
    letter-spacing: 2px;
}
.auth-btn:hover {
    background: var(--primary-yellow);
    color: #000;
    transform: translate(4px, 4px);
    box-shadow: 2px 2px 0px var(--border-color);
}
.google-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    background: #fff;
    color: #000;
    padding: 12px;
    font-size: 20px;
    font-weight: bold;
    text-decoration: none;
    border: 3px solid var(--border-color);
    box-shadow: 4px 4px 0px var(--border-color);
    transition: all 0.1s ease;
    margin-bottom: 20px;
}
.google-btn:hover {
    background: var(--primary-red);
    color: #fff;
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0px var(--border-color);
}
.google-btn img { width: 24px; }
.divider {
    text-align: center;
    margin: 25px 0;
    position: relative;
    font-weight: bold;
    font-size: 20px;
}
.divider::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 3px;
    background: var(--border-color);
    top: 50%;
    left: 0;
    z-index: 1;
}
.divider span {
    background: #fff;
    padding: 0 15px;
    position: relative;
    z-index: 2;
    border: 3px solid var(--border-color);
}
.auth-link {
    text-align: center;
    margin-top: 25px;
    font-size: 18px;
    font-weight: bold;
}
.auth-link a {
    color: var(--primary-red);
    text-decoration: none;
    font-family: 'Bangers', cursive;
    font-size: 24px;
    letter-spacing: 1px;
}
.auth-link a:hover {
    text-shadow: 1px 1px 0px var(--border-color);
}
.messages .alert {
    padding: 15px;
    border: 3px solid var(--border-color);
    margin-bottom: 20px;
    font-weight: bold;
    text-align: center;
    background: var(--primary-yellow);
}
@media(max-width: 600px) {
    .navbar { padding: 15px; justify-content: center; flex-wrap: wrap; gap: 15px; }
    .auth-card { padding: 25px; }
}
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <a href="{% url 'home' %}" class="logo" style="text-decoration: none; color: inherit;">
        <span class="logo-icon"> ✦ </span>
        <span class="logo-text">Velora</span>
    </a>
</nav>

<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Login to Velora</h2>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        
        {% if error %}
            <div class="messages">
                <div class="alert alert-danger" style="background: var(--primary-red); color: white;">
                    {{ error }}
                </div>
            </div>
        {% endif %}

        <!-- Google Sign-In Redirect Button -->
        <a href="{% url 'google_login' %}" class="google-btn">
            <img src="https://cdn-icons-png.flaticon.com/512/300/300221.png" alt="Google Logo">
            Continue with Google
        </a>

        <div class="divider">
            <span>OR</span>
        </div>

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="input-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="auth-btn">LOGIN</button>
        </form>

        <div style="text-align: center; margin-top: 15px;">
            <a href="{% url 'forgot_password' %}" style="color: var(--primary-blue); text-decoration: none; font-weight: bold; font-size: 16px; border-bottom: 2px dashed var(--primary-blue); padding-bottom: 2px; transition: all 0.1s ease;" onmouseover="this.style.color='var(--primary-red)'; this.style.borderColor='var(--primary-red)'" onmouseout="this.style.color='var(--primary-blue)'; this.style.borderColor='var(--primary-blue)'">Forgot Password?</a>
        </div>

        <div class="auth-link">
            Don't have an account? <br>
            <a href="{% url 'signup' %}">Create New Account</a>
        </div>
    </div>
</div>

<script>
    function handleCredentialResponse(response) {
        const id_token = response.credential;
        fetch("/auth/google/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": getCookie('csrftoken')
            },
            body: JSON.stringify({ token: id_token })
        })
        .then(res => {
            if (!res.ok) {
                return res.json().then(err => { throw new Error(err.error || 'Server error'); });
            }
            return res.json();
        })
        .then(data => {
            if (data.access_token) {
                window.location.href = "/";
            } else {
                alert("Authentication failure: " + (data.error || "Unknown"));
            }
        })
        .catch(err => {
            console.error("Error connecting to backend authentication:", err);
            alert("Connection error: " + err.message);
        });
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
</script>
</body>
</html>
