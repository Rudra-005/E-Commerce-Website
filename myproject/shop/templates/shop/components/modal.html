<!-- Bootstrap 5 Style Modals & Toasts (Custom Scoped) -->
<style>
/* Reset for our modal elements */
.bs-modal, .bs-toast-container {
    font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    color: #374151; /* Softer dark gray */
}

/* Modal Backbone */
.bs-modal {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1055;
    display: none;
    width: 100%;
    height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
    outline: 0;
}
.bs-modal.show {
    display: block;
}
.bs-modal-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1050;
    width: 100vw;
    height: 100vh;
    background-color: rgba(17, 24, 39, 0.6); /* Slightly blueish dark */
    backdrop-filter: blur(4px); /* Modern blur effect */
    opacity: 0;
    transition: opacity .2s ease-in-out;
    pointer-events: none;
}
.bs-modal-backdrop.show {
    opacity: 1;
    pointer-events: auto;
}
.bs-modal-dialog {
    position: relative;
    width: auto;
    margin: 1.75rem auto;
    pointer-events: none;
    max-width: 500px;
    opacity: 0;
    transform: translateY(-50px);
    transition: transform .3s ease-out, opacity .3s ease-out;
}
.bs-modal.show .bs-modal-dialog {
    opacity: 1;
    transform: none;
}
.bs-modal-dialog-centered {
    display: flex;
    align-items: center;
    min-height: calc(100% - 3.5rem);
}
.bs-modal-content {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 100%;
    pointer-events: auto;
    background-color: #ffffff;
    background-clip: padding-box;
    border: none;
    border-radius: 12px;
    outline: 0;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
}
.bs-modal-header {
    display: flex;
    flex-shrink: 0;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid #f3f4f6; /* Very light gray */
    border-top-left-radius: 12px;
    border-top-right-radius: 12px;
}
.bs-modal-title {
    margin-bottom: 0;
    line-height: 1.5;
    font-size: 1.25rem;
    font-weight: 700;
    color: #111827; /* Darker title */
}
.bs-btn-close {
    box-sizing: content-box;
    width: 1em;
    height: 1em;
    padding: 0.25em 0.25em;
    color: #000;
    background: transparent url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%23000'%3e%3cpath d='M.293.293a1 1 0 0 1 1.414 0L8 6.586 14.293.293a1 1 0 1 1 1.414 1.414L9.414 8l6.293 6.293a1 1 0 0 1-1.414 1.414L8 9.414l-6.293 6.293a1 1 0 0 1-1.414-1.414L6.586 8 .293 1.707a1 1 0 0 1 0-1.414z'/%3e%3c/svg%3e") center/1em auto no-repeat;
    border: 0;
    border-radius: 0.375rem;
    opacity: .5;
    cursor: pointer;
}
.bs-btn-close:hover {
    opacity: .75;
}
.bs-modal-body {
    position: relative;
    flex: 1 1 auto;
    padding: 1.5rem;
}
.bs-modal-footer {
    display: flex;
    flex-shrink: 0;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    padding: 1rem 1.5rem;
    border-top: 1px solid #f3f4f6;
    border-bottom-right-radius: 12px;
    border-bottom-left-radius: 12px;
    gap: 0.75rem;
}

/* Buttons */
.bs-btn {
    display: inline-block;
    font-weight: 600;
    line-height: 1.5;
    color: #374151;
    text-align: center;
    text-decoration: none;
    vertical-align: middle;
    cursor: pointer;
    user-select: none;
    background-color: transparent;
    border: 1px solid transparent;
    padding: 0.5rem 1.25rem;
    font-size: 0.95rem;
    border-radius: 8px;
    transition: all .2s ease-in-out;
}
.bs-btn-primary {
    color: #fff;
    background-color: #3b82f6; /* Modern Blue */
    border-color: #3b82f6;
    box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
}
.bs-btn-primary:hover {
    background-color: #2563eb;
    border-color: #2563eb;
    box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
}
.bs-btn-danger {
    color: #fff;
    background-color: #ef4444; /* Modern Red */
    border-color: #ef4444;
    box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
}
.bs-btn-danger:hover {
    background-color: #dc2626;
    border-color: #dc2626;
    box-shadow: 0 4px 6px -1px rgba(220, 38, 38, 0.2);
}
.bs-btn-secondary {
    color: #374151;
    background-color: #f3f4f6;
    border-color: #d1d5db;
}
.bs-btn-secondary:hover {
    background-color: #e5e7eb;
    border-color: #d1d5db;
}
.bs-btn:disabled {
    opacity: 0.65;
    pointer-events: none;
}

/* Forms */
.bs-form-label {
    margin-bottom: 0.5rem;
    font-weight: 600;
    font-size: 0.875rem;
    color: #374151;
    display: inline-block;
}
.bs-form-control {
    display: block;
    width: 100%;
    padding: 0.625rem 0.75rem;
    font-size: 0.95rem;
    font-weight: 400;
    line-height: 1.5;
    color: #111827;
    background-color: #fff;
    background-clip: padding-box;
    border: 1px solid #d1d5db; /* Softer border */
    appearance: none;
    border-radius: 8px; /* Rounded inputs */
    transition: border-color .15s ease-in-out,box-shadow .15s ease-in-out;
    box-sizing: border-box;
}
.bs-form-control:focus {
    color: #111827;
    background-color: #fff;
    border-color: #3b82f6; /* Modern Blue */
    outline: 0;
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); /* Soft focus ring */
}
.bs-form-control.is-invalid {
    border-color: #dc3545;
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' width='12' height='12' fill='none' stroke='%23dc3545'%3e%3ccircle cx='6' cy='6' r='4.5'/%3e%3cpath stroke-linejoin='round' d='M5.8 3.6h.4L6 6.5z'/%3e%3ccircle cx='6' cy='8.2' r='.6' fill='%23dc3545' stroke='none'/%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right calc(0.375em + 0.1875rem) center;
    background-size: calc(0.75em + 0.375rem) calc(0.75em + 0.375rem);
}
.bs-invalid-feedback {
    display: none;
    width: 100%;
    margin-top: 0.25rem;
    font-size: .875em;
    color: #dc3545;
}
.bs-form-control.is-invalid ~ .bs-invalid-feedback {
    display: block;
}

/* Spinner */
.bs-spinner-border {
    display: inline-block;
    width: 1rem;
    height: 1rem;
    vertical-align: -0.125em;
    border: 0.2em solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    animation: 0.75s linear infinite bs-spinner-border;
}
@keyframes bs-spinner-border {
    to { transform: rotate(360deg); }
}

/* Toast */
.bs-toast-container {
    position: fixed;
    top: 1rem;
    right: 1rem;
    z-index: 1090;
}
.bs-toast {
    width: 350px;
    max-width: 100%;
    font-size: .875rem;
    pointer-events: auto;
    background-color: rgba(255,255,255,.85);
    background-clip: padding-box;
    border: 1px solid rgba(0,0,0,.175);
    box-shadow: 0 0.5rem 1rem rgba(0,0,0,.15);
    border-radius: 0.25rem;
    opacity: 0;
    transform: translateX(100%);
    transition: opacity 0.3s ease, transform 0.3s ease;
    margin-bottom: 0.5rem;
}
.bs-toast.show {
    opacity: 1;
    transform: translateX(0);
}
.bs-toast-header {
    display: flex;
    align-items: center;
    padding: 0.5rem 0.75rem;
    color: #6c757d;
    background-color: rgba(255,255,255,.85);
    background-clip: padding-box;
    border-bottom: 1px solid rgba(0,0,0,.05);
    border-top-left-radius: calc(0.25rem - 1px);
    border-top-right-radius: calc(0.25rem - 1px);
}
.bs-toast-body {
    padding: 0.75rem;
    word-wrap: break-word;
}
.bs-toast-success .bs-toast-header {
    color: #198754;
}
.bs-toast-danger .bs-toast-header {
    color: #dc3545;
}
</style>

<!-- Modal Backdrop -->
<div class="bs-modal-backdrop" id="bsModalBackdrop"></div>

<!-- Generic Reusable Modal -->
<div class="bs-modal" id="bsReusableModal" tabindex="-1" role="dialog" aria-labelledby="bsModalTitle" aria-hidden="true">
    <div class="bs-modal-dialog bs-modal-dialog-centered" role="document">
        <div class="bs-modal-content">
            <div class="bs-modal-header">
                <h5 class="bs-modal-title" id="bsModalTitle">Title</h5>
                <button type="button" class="bs-btn-close" id="bsModalCloseBtn" aria-label="Close"></button>
            </div>
            <div class="bs-modal-body" id="bsModalBody">
                <!-- Content injected dynamically -->
            </div>
            <div class="bs-modal-footer" id="bsModalFooter">
                <!-- Buttons injected dynamically -->
            </div>
        </div>
    </div>
</div>

<!-- Toast Container -->
<div class="bs-toast-container" id="bsToastContainer"></div>
